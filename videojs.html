<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor VideoJS</title>

  <!-- CSS Video.js -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-container {
      width: 100%;
      max-width: 1280px;
    }

    .video-js {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video
      id="mi-video"
      class="video-js vjs-big-play-centered"
      controls
      preload="metadata"
      crossorigin="anonymous"
      playsinline
    >
      <source
        src="https://knife-cloudy-tuner-buildings.trycloudflare.com/514027.mp4"
        type="video/mp4">
    </video>
  </div>

  <!-- JS Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    const player = videojs('mi-video', {
      controls: true,
      autoplay: false,
      preload: 'metadata',
      responsive: true,
      fluid: true
    });

    player.ready(function () {
      console.log("Video.js listo");
    });

    player.on("loadedmetadata", function () {
      console.log("Metadatos cargados");
    });

    player.on("canplay", function () {
      console.log("Puede reproducir");
    });

    player.on("error", function () {
      console.error(player.error());
    });
  </script>

</body>
</html>
