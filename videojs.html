<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clappr Player</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#player{
    width:100%;
    height:100vh;
}
</style>

<!-- Clappr -->
<script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

<!-- Plugin selector de audio -->
<script src="https://cdn.jsdelivr.net/npm/clappr-audio-selector-plugin@0.1.37/dist/audio-selector.min.js"></script>

</head>
<body>

<div id="player"></div>

<script>

const player = new Clappr.Player({

    source: "https://knife-cloudy-tuner-buildings.trycloudflare.com/Spider-Man/master.m3u8",

    parentId: "#player",

    width: "100%",

    height: "100%",

    autoPlay: false,

    mute: false,

    playback: {
        hlsjsConfig: {
            enableWorker: true,
            lowLatencyMode: false
        }
    },

    plugins: [
        ClapprAudioSelectorPlugin
    ]

});

</script>

</body>
</html>
