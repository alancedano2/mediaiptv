<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor VideoJS Fullscreen</title>
  
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden; /* Elimina scrollbars */
    }

    /* El contenedor ocupa toda la pantalla */
    .video-container {
      width: 100vw;
      height: 100vh;
    }

    /* Forzamos a VideoJS a llenar el contenedor al 100% */
    .video-js {
      width: 100% !important;
      height: 100% !important;
    }

    /* Centrar el botón gigante de Play */
    .video-js .vjs-big-play-button {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video
      id="mi-video"
      class="video-js vjs-default-skin"
      controls
      preload="auto"
      poster=""
    >
      <source src="https://hiveatick.casadenoval.uk/main/secure/85c6e3c371028780d7345169acb594f51289d287d03513b04506ced6bc0c74ed/1785108953/boxing-1.m3u8" type="application/x-mpegURL" />
      
      <p class="vjs-no-js">
        Para ver este video, por favor habilita JavaScript y considera actualizar tu navegador a uno que soporte video HTML5.
      </p>
    </video>
  </div>

  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    var player = videojs('mi-video', {
      fill: true, // Asegura que el video se ajuste a todo el contenedor
      responsive: true,
      html5: {
        vhs: {
          overrideNative: true
        },
        nativeAudioTracks: false,
        nativeVideoTracks: false
      }
    });

    player.ready(function() {
      console.log('Reproductor listo en pantalla completa');
    });
  </script>

</body>
</html>
