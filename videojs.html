<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor VideoJS</title>
  
  <!-- Estilos de VideoJS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .video-container {
      width: 100%;
      max-width: 900px;
    }

    /* Forzar que el menú de audio siempre aparezca visible en la barra */
    .vjs-control-bar .vjs-audio-button {
      display: flex !important;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video
      id="mi-video"
      class="video-js vjs-default-skin vjs-big-play-centered vjs-fluid"
      controls
      preload="auto"
      crossorigin="anonymous"
    >
      <source 
        src="https://knife-cloudy-tuner-buildings.trycloudflare.com/514027.mp4" 
        type="application/x-mpegURL" 
      />
    </video>
  </div>

  <!-- JS de VideoJS -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    // Inicialización habilitando el selector de audio de VideoJS
    var player = videojs('mi-video', {
      html5: {
        vhs: {
          overrideNative: true // Fuerza a VideoJS a procesar las pistas de audio sobre el motor nativo
        },
        nativeAudioTracks: false
      }
    });
  </script>

</body>
</html>
