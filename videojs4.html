<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video.js Player</title>
<link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet">
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}
.video-js {
    width: 100vw !important;
    height: 100vh !important;
}
</style>
</head>
<body>

<video
    id="player"
    class="video-js vjs-default-skin vjs-big-play-centered"
    controls
    preload="auto"
    crossorigin="anonymous">
</video>

<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
<script>
const player = videojs("player", {
    fluid: false,
    responsive: false,
    controlBar: {
        audioTrackButton: true
    }
});

// Corregido a video/mp4
player.src({
    src: "https://knife-cloudy-tuner-buildings.trycloudflare.com/laodisea/salida.m3u8",
    type:"application/x-mpegURL"
});

player.ready(() => {
    console.log("Player listo");
});

player.on("loadedmetadata", () => {
    const tracks = player.audioTracks();
    console.log("Audios encontrados:", tracks.length);

    for (let i = 0; i < tracks.length; i++) {
        console.log(tracks[i].label, tracks[i].language);
    }
});

player.on("error", () => {
    console.error("Error en el reproductor:", player.error());
});
</script>
</body>
</html>
