<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unidos por los Nuestros</title>

  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000 url("unidosporlosnuestros.jpg") center center / cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 95%;
      max-width: 1200px;
    }

    .title {
      color: white;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.7);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 21px;
      }

      .container {
        width: 100%;
      }

      .player-wrapper {
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="container">
    <div class="title">Unidos por los Nuestros</div>

    <div class="player-wrapper">
      <div id="player"></div>
    </div>
  </div>

  <script>
    // PEGA AQUÍ TU ENLACE M3U8
    const STREAM_URL = "PEGA_AQUI_TU_LINK_M3U8";

    const player = new Clappr.Player({
      source: STREAM_URL,
      parentId: "#player",
      width: "100%",
      height: "100%",
      autoPlay: true,
      mute: false,
      hideMediaControl: false,
      playback: {
        playInline: true
      }
    });
  </script>

</body>
</html>
