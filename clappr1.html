<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unidos por los Nuestros</title>

  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>

  <div id="player"></div>

  <script>
    const STREAM_URL = "https://nbculocallive.akamaized.net/hls/live/2037499/puertorico/stream1/master.m3u8";

    const player = new Clappr.Player({
      source: STREAM_URL,

      parentId: "#player",

      width: "100%",
      height: "100%",

      poster: "unidosporlosnuestros.jpg",

      autoPlay: false,

      playback: {
        playInline: true
      }
    });
  </script>

</body>
</html>
