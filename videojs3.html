<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minions Player</title>

    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="player"></div>

<script>
const player = new Clappr.Player({
    parentId: "#player",
    source: "https://knife-cloudy-tuner-buildings.trycloudflare.com/Minions.mp4",
    autoPlay: true,
    mute: false,
    width: "100%",
    height: "100%",
    playback: {
        playInline: true
    },
    mediacontrol: {
        seekbar: "#ff0000",
        buttons: "#ffffff"
    }
});
</script>

</body>
</html>
