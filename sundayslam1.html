<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sundayslam1 - Clappr Multi-Audio</title>
    
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: black;
        }
        #clappr-player-sundayslam1 { 
            width: 100%; 
            height: 100%; 
        }
    </style>

    <!-- Clappr Base -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    
    <!-- HLS.js Core y Playback Plugin -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-hlsjs-playback@0.5.2/dist/clappr-hlsjs-playback.min.js"></script>

    <!-- Plugin para seleccionar pistas de Audio/Idiomas en Clappr -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-audio-tracks-plugin@latest/dist/clappr-audio-tracks-plugin.min.js"></script>
    
</head>
<body>

    <div id="clappr-player-sundayslam1"></div>

    <script>
        const M3U8_URL = 'https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8';

        // Identificar el playback HLS.js cargado globalmente desde el CDN
        var HLSPlayback = window.HlsjsPlayback || HlsjsPlayback;
        var AudioTracksPlugin = window.AudioTracksPlugin || AudioTracks;

        var player = new Clappr.Player({
            source: M3U8_URL,
            parentId: '#clappr-player-sundayslam1',
            mimeType: 'application/x-mpegurl',
            plugins: {
                playback: [HLSPlayback],
                core: [AudioTracksPlugin]
            },
            hlsjsConfig: {
                // Forzar soporte de audios alternativos y subtítulos
                enableAudioTrackSwitching: true
            },
            autoPlay: true,
            width: '100%',
            height: '100%'
        });
    </script>

</body>
</html>
