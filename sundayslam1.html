<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sundayslam1 - Clappr Multi-Audio</title>
    
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: black;
        }
        #clappr-player-sundayslam1 { 
            width: 100%; 
            height: 100%; 
        }
    </style>

    <!-- Clappr Base (Incluye HLS.js integrado) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <!-- Plugin de Audio Tracks para Clappr -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-audio-tracks-plugin@latest/dist/clappr-audio-tracks-plugin.min.js"></script>
    
</head>
<body>

    <div id="clappr-player-sundayslam1"></div>

    <script>
        const M3U8_URL = 'https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8';

        // Detectar el plugin de audio de forma segura sin lanzar ReferenceError
        var AudioTracksPlugin = window.AudioTracksPlugin || window.AudioTracks || null;

        var pluginsArr = [];
        if (AudioTracksPlugin) {
            pluginsArr.push(AudioTracksPlugin);
        }

        var player = new Clappr.Player({
            source: M3U8_URL,
            parentId: '#clappr-player-sundayslam1',
            mimeType: 'application/x-mpegurl',
            plugins: {
                core: pluginsArr
            },
            hlsjsConfig: {
                enableAudioTrackSwitching: true
            },
            autoPlay: true,
            width: '100%',
            height: '100%'
        });
    </script>

</body>
</html>
