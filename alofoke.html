<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse - Cuenta Regresiva</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        .glass-box {
            display: flex;
            align-items: center;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 60px;
            border-radius: 20px;
            border: 2px solid #FF6600;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.4),
                        inset 0 0 10px rgba(255, 102, 0, 0.15);
            color: white;
            gap: 50px;
        }

        .info h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .info .teams {
            color: #FF6600;
            font-size: 25px;
            font-weight: 900;
            margin: 4px 0;
            text-transform: uppercase;
        }

        .info p {
            margin: 8px 0 0;
            font-size: 16px;
            color: #bbb;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .divider {
            width: 2px;
            height: 90px;
            background: #FF6600;
            box-shadow: 0 0 12px #FF6600;
            opacity: 0.7;
        }

        .timer {
            display: flex;
            gap: 30px;
            text-align: center;
        }

        .time-group {
            display: flex;
            flex-direction: column;
        }

        .time-group b {
            font-size: 48px;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
        }

        .time-group span {
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 8px;
            letter-spacing: 2px;
            color: #FF6600;
            font-weight: 600;
        }

        @media (max-width: 650px) {
            .glass-box {
                flex-direction: column;
                padding: 25px;
                gap: 25px;
                text-align: center;
            }

            .divider {
                width: 80%;
                height: 2px;
            }

            .timer {
                gap: 18px;
            }

            .time-group b {
                font-size: 34px;
            }

            .info .teams {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="glass-box">
        <div class="info">
            <h1>STREAMVERSE</h1>
            <div class="teams">Amazon Music City Sessions: Jowell & Randy</div>
            <p>HOY • 9:00 PM</p>
        </div>

        <div class="divider"></div>

        <div class="timer">
            <div class="time-group">
                <b id="days">00</b>
                <span>Días</span>
            </div>

            <div class="time-group">
                <b id="hours">00</b>
                <span>Hrs</span>
            </div>

            <div class="time-group">
                <b id="mins">00</b>
                <span>Min</span>
            </div>

            <div class="time-group">
                <b id="secs">00</b>
                <span>Seg</span>
            </div>
        </div>
    </div>

    <script>
        // Hoy, 24 de octubre de 2026, a las 9:00 PM (Puerto Rico)
        const targetDate = new Date(2026, 9, 24, 21, 0, 0).getTime();

        function countdown() {
            const currentTime = Date.now();
            const gap = targetDate - currentTime;

            if (gap <= 0) {
                document.querySelector(".timer").innerHTML =
                    "<b style='color:#FF6600; font-size:30px; text-shadow:0 0 10px rgba(255,102,0,0.5);'>¡TRANSMISIÓN EN VIVO!</b>";
                return;
            }

            const d = Math.floor(gap / (1000 * 60 * 60 * 24));
            const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((gap % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(d).padStart(2, "0");
            document.getElementById("hours").innerText = String(h).padStart(2, "0");
            document.getElementById("mins").innerText = String(m).padStart(2, "0");
            document.getElementById("secs").innerText = String(s).padStart(2, "0");
        }

        countdown();
        setInterval(countdown, 1000);
    </script>

</body>
</html>
