<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay - Advertencia</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* Separado de la esquina inferior izquierda */
    .warning-box {
      position: fixed;
      bottom: 48px;
      left: 48px;
      display: flex;
      align-items: stretch;
      background: rgba(12, 14, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-left: 6px solid #e63946;
      border-radius: 10px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      max-width: 560px;

      /* Estado oculto inicial */
      opacity: 0;
      transform: translateX(-45px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .warning-box.visible {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .rating-badge {
      background: linear-gradient(135deg, #e63946, #b51724);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 20px;
      min-width: 96px;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    .rating-badge .age {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
    }

    .rating-badge .sub {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      opacity: 0.92;
    }

    .warning-content {
      padding: 15px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .warning-title {
      color: #ff4d5a;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 5px;
    }

    .warning-text {
      color: #f1f5f9;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.42;
    }
  </style>
</head>
<body>

  <div id="warningBox" class="warning-box">
    <div class="rating-badge">
      <span id="badgeMain" class="age">+18</span>
      <span id="badgeSub" class="sub">ADULTOS</span>
    </div>
    <div class="warning-content">
      <div id="warningTitle" class="warning-title">⚠️ ADVERTENCIA DE CONTENIDO</div>
      <div id="warningText" class="warning-text">
        Este evento contiene lenguaje fuerte y escenas intensas. Se recomienda discreción; no apto para menores de edad.
      </div>
    </div>
  </div>

  <script>
    // Cambia este ID único por el nombre de tu canal/evento para que nadie más lo controle
    const CANAL_ID = 'mi_evento_advertencia_2026_x9k2';
    const TOPIC_CMD = `overlay/${CANAL_ID}/cmd`;
    const TOPIC_STATE = `overlay/${CANAL_ID}/state`;

    const warningBox = document.getElementById('warningBox');
    const badgeMain = document.getElementById('badgeMain');
    const badgeSub = document.getElementById('badgeSub');
    const warningTitle = document.getElementById('warningTitle');
    const warningText = document.getElementById('warningText');

    let autoHideTimer = null;

    function updateContent(data) {
      if (data.badgeMain !== undefined) badgeMain.textContent = data.badgeMain;
      if (data.badgeSub !== undefined) badgeSub.textContent = data.badgeSub;
      if (data.title !== undefined) warningTitle.textContent = data.title;
      if (data.text !== undefined) warningText.textContent = data.text;
    }

    function showWarning(durationSeconds = 0) {
      clearTimeout(autoHideTimer);
      warningBox.classList.add('visible');

      if (durationSeconds > 0) {
        autoHideTimer = setTimeout(() => {
          hideWarning();
          publishState(false);
        }, durationSeconds * 1000);
      }
    }

    function hideWarning() {
      clearTimeout(autoHideTimer);
      warningBox.classList.remove('visible');
    }

    function handleCommand(msg) {
      if (!msg || !msg.action) return;
      if (msg.action === 'show') {
        updateContent(msg);
        showWarning(msg.duration || 0);
        publishState(true);
      } else if (msg.action === 'hide') {
        hideWarning();
        publishState(false);
      } else if (msg.action === 'update') {
        updateContent(msg);
      }
    }

    // Respaldo local (BroadcastChannel + localStorage)
    const bc = new BroadcastChannel(CANAL_ID);
    bc.onmessage = (e) => handleCommand(e.data);

    window.addEventListener('storage', (e) => {
      if (e.key === CANAL_ID && e.newValue) {
        try { handleCommand(JSON.parse(e.newValue)); } catch (_) {}
      }
    });

    // Sincronización remota en tiempo real (funciona entre navegador y OBS)
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'obs_main_' + Math.random().toString(16).slice(2, 10),
      clean: true,
      reconnectPeriod: 2000
    });

    function publishState(visible) {
      if (client && client.connected) {
        client.publish(TOPIC_STATE, JSON.stringify({ visible }), { retain: true });
      }
    }

    client.on('connect', () => {
      client.subscribe(TOPIC_CMD);
    });

    client.on('message', (topic, payload) => {
      if (topic === TOPIC_CMD) {
        try {
          handleCommand(JSON.parse(payload.toString()));
        } catch (err) {
          console.error('Error leyendo comando:', err);
        }
      }
    });
  </script>
</body>
</html>
