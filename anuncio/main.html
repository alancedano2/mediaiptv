<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay - Advertencia de Contenido</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Montserrat', sans-serif;
    }

    /* Contenedor separado de las esquinas */
    .warning-box {
      position: fixed;
      bottom: 45px;
      left: 45px;
      display: flex;
      align-items: stretch;
      background: rgba(12, 14, 18, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-left: 6px solid #e63946;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      overflow: hidden;
      max-width: 540px;

      /* Estado oculto inicial */
      opacity: 0;
      transform: translateX(-40px) scale(0.96);
      pointer-events: none;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .warning-box.visible {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    /* Cuadro de clasificación (+18 / TV-MA) */
    .rating-badge {
      background: linear-gradient(135deg, #e63946, #b51724);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 20px;
      min-width: 95px;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    .rating-badge .age {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
    }

    .rating-badge .sub {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      opacity: 0.9;
    }

    /* Texto de advertencia */
    .warning-content {
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .warning-title {
      color: #ff4d5a;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .warning-text {
      color: #f1f5f9;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="warningBox" class="warning-box">
    <div class="rating-badge">
      <span id="badgeMain" class="age">+18</span>
      <span id="badgeSub" class="sub">ADULTOS</span>
    </div>
    <div class="warning-content">
      <div id="warningTitle" class="warning-title">⚠️ ADVERTENCIA DE CONTENIDO</div>
      <div id="warningText" class="warning-text">
        Este evento contiene lenguaje fuerte y escenas intensas. Se recomienda discreción; no apto para menores de edad.
      </div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('overlay_advertencia');
    const warningBox = document.getElementById('warningBox');
    const badgeMain = document.getElementById('badgeMain');
    const badgeSub = document.getElementById('badgeSub');
    const warningTitle = document.getElementById('warningTitle');
    const warningText = document.getElementById('warningText');

    let autoHideTimer = null;

    function updateContent(data) {
      if (data.badgeMain !== undefined) badgeMain.textContent = data.badgeMain;
      if (data.badgeSub !== undefined) badgeSub.textContent = data.badgeSub;
      if (data.title !== undefined) warningTitle.textContent = data.title;
      if (data.text !== undefined) warningText.textContent = data.text;
    }

    function showWarning(durationSeconds = 0) {
      clearTimeout(autoHideTimer);
      warningBox.classList.add('visible');

      if (durationSeconds > 0) {
        autoHideTimer = setTimeout(() => {
          hideWarning();
          channel.postMessage({ action: 'status', visible: false });
        }, durationSeconds * 1000);
      }
    }

    function hideWarning() {
      clearTimeout(autoHideTimer);
      warningBox.classList.remove('visible');
    }

    // Escuchar comandos desde control.html
    channel.onmessage = (event) => {
      const msg = event.data;
      if (msg.action === 'show') {
        updateContent(msg);
        showWarning(msg.duration || 0);
      } else if (msg.action === 'hide') {
        hideWarning();
      } else if (msg.action === 'update') {
        updateContent(msg);
      }
    };
  </script>
</body>
</html>
