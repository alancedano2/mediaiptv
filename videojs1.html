<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clappr Multi Audio</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#player {
    width:100%;
    height:100vh;
}
</style>


<!-- Clappr -->
<script src="https://cdn.jsdelivr.net/npm/clappr@0.11.7/dist/clappr.min.js"></script>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Plugin selector audio -->
<script src="https://cdn.jsdelivr.net/npm/clappr-audio-selector-plugin@0.1.3/dist/audio-selector.min.js"></script>


</head>

<body>

<div id="player"></div>


<script>

const player = new Clappr.Player({

    source:
    "https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8",

    parentId:"#player",

    width:"100%",

    height:"100%",

    autoPlay:false,

    mute:false,

    mediacontrol:{
        seekbar:true,
        buttons:[
            "play",
            "mute",
            "volume",
            "audio",
            "fullscreen"
        ]
    },


    plugins:[
        AudioTrackSelector
    ],


    playback:{
        hlsjsConfig:{
            enableWorker:true
        }
    }

});


</script>

</body>
</html>
