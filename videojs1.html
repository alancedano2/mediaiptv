<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clappr Multi Audio</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
}

#player{
    width:100%;
    height:100vh;
}
</style>

<!-- Clappr -->
<script src="https://cdn.jsdelivr.net/npm/clappr@0.4.7/dist/clappr.min.js"></script>

<!-- HLS Playback -->
<script src="https://cdn.jsdelivr.net/npm/@clappr/hlsjs-playback@1.0.1/dist/hlsjs-playback.min.js"></script>

<!-- Audio Selector -->
<script src="https://cdn.jsdelivr.net/npm/clappr-audio-selector-plugin@0.1.3/dist/audio-selector.min.js"></script>

</head>

<body>

<div id="player"></div>


<script>

console.log("Clappr:", typeof Clappr);


var player = new Clappr.Player({

    source:
    "https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8",

    parentId:"#player",

    width:"100%",
    height:"100%",

    autoPlay:false,

    plugins:[
        HlsjsPlayback,
        AudioSelectorPlugin
    ]

});


</script>

</body>
</html>
