<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Clappr Audio Selector</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#000;
    width:100%;
    height:100%;
}

#player{
    width:100%;
    height:100vh;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@c3voc/clappr-audio-track-selector@latest/dist/clappr-audio-track-selector.min.js"></script>

</head>

<body>

<div id="player"></div>


<script>

console.log("Clappr:", typeof Clappr);
console.log("Audio plugin:", window.ClapprAudioTrackSelector);


const player = new Clappr.Player({

    source:
    "https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8",

    parentId:"#player",

    width:"100%",
    height:"100%",

    autoPlay:false,

    plugins:[
        ClapprAudioTrackSelector
    ]

});


</script>

</body>
</html>
