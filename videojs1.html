<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaka Player</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.2/controls.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.2/shaka-player.ui.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #video-container {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div id="video-container"
     data-shaka-player-container
     data-shaka-player-cast-receiver-id="">
  <video autoplay controls data-shaka-player id="video"></video>
</div>

<script>
async function initPlayer() {
  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    alert("Tu navegador no es compatible con Shaka Player.");
    return;
  }

  const video = document.getElementById("video");
  const player = new shaka.Player(video);

  player.addEventListener("error", event => {
    console.error("Error:", event.detail);
  });

  try {
    await player.load("https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/index.m3u8");
    console.log("Video cargado correctamente.");
  } catch (error) {
    console.error("Error al cargar:", error);
  }
}

document.addEventListener("DOMContentLoaded", initPlayer);
</script>

</body>
</html>
