<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clappr Multi Audio</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
}

#player{
    width:100%;
    height:100vh;
}
</style>

</head>

<body>

<div id="player"></div>


<script type="module">

import ClapprAudioSelectorPlugin from 'https://cdn.skypack.dev/clappr-audio-selector-plugin';

window.addEventListener("load", () => {

    const player = new Clappr.Player({

        source:
        "https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8",

        parentId:"#player",

        width:"100%",
        height:"100%",

        autoPlay:false,

        plugins:[
            ClapprAudioSelectorPlugin
        ]

    });

});

</script>


<!-- Clappr -->
<script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

</body>
</html>
