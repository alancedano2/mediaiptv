<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MediaElement HLS</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mediaelement@7.0.2/build/mediaelementplayer.min.css">

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
}

.player{
    width:100%;
    height:100vh;
}

video{
    width:100%;
    height:100%;
}
</style>

</head>

<body>

<div class="player">

<video 
id="player"
controls
preload="auto">

<source
src="https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8"
type="application/x-mpegURL">

</video>

</div>


<script src="https://cdn.jsdelivr.net/npm/mediaelement@7.0.2/build/mediaelement-and-player.min.js"></script>


<script>

const player = new MediaElementPlayer('player', {

    features:[
        'playpause',
        'current',
        'progress',
        'duration',
        'volume',
        'tracks',
        'fullscreen'
    ],

    success:function(media){
        console.log("MediaElement cargado");
    },

    error:function(e){
        console.log("Error:",e);
    }

});

</script>

</body>
</html><video
id="video"
data-shaka-player
autoplay
controls>
</video>

</div>


<script>

async function init(){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){
    alert("Navegador no compatible");
    return;
}


const video = document.getElementById("video");

const player = new shaka.Player(video);


const ui = new shaka.ui.Overlay(
    player,
    document.querySelector(".video-container"),
    video
);


player.addEventListener("error", e=>{
    console.error("Error:", e.detail);
});


await player.load(
"https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8"
);


console.log("Cargado");

console.log(
"Audios:",
player.getVariantTracks()
);

console.log(
"Subtitulos:",
player.getTextTracks()
);


}


document.addEventListener(
"DOMContentLoaded",
init
);

</script>


</body>
</html>
