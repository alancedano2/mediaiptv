<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/clappr-audio-selector-plugin@0.1.37/dist/audio-selector.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
}

#player{
    width:100%;
    height:100vh;
}
</style>

</head>

<body>

<div id="player"></div>

<script>

console.log("Clappr:", Clappr);
console.log("Plugin:", window);


var player = new Clappr.Player({

    source:
    "https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8",

    parentId:"#player",

    width:"100%",
    height:"100%",

    plugins:[
        ClapprAudioSelectorPlugin
    ]

});

</script>

</body>
</html>
