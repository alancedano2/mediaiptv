<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Michael 4K HDR</title>

<link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#player {
    width: 100vw;
    height: 100vh;
}

.video-js {
    width: 100%;
    height: 100%;
}
</style>

</head>

<body>

<video
    id="player"
    class="video-js vjs-big-play-centered"
    controls
    preload="auto"
    autoplay
    crossorigin="anonymous">

    <source
        src="https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8"
        type="application/x-mpegURL">

</video>


<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>

<script>

const player = videojs("player", {

    fluid: false,

    responsive: false,

    autoplay: true,

    controls: true,

    preload: "auto",

    html5: {
        vhs: {
            overrideNative: true
        },
        nativeAudioTracks: false,
        nativeTextTracks: false
    }

});


player.ready(function(){

    console.log("Video.js listo");

});


player.on("loadedmetadata", function(){

    console.log("Video cargado");

    console.log(
        "Audios:",
        player.audioTracks().length
    );

    console.log(
        "Subtitulos:",
        player.textTracks().length
    );

});


player.on("error", function(){

    console.log(
        player.error()
    );

});

</script>

</body>
</html>
