<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clappr Multi Audio</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
}

#player{
    width:100%;
    height:100vh;
}
</style>


<script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

<script type="module">

import ClapprAudioTrackSelector from "https://cdn.jsdelivr.net/npm/@c3voc/clappr-audio-track-selector@0.2.4/dist/clappr-audio-track-selector.esm.js";

window.ClapprAudioTrackSelector = ClapprAudioTrackSelector;

</script>

</head>

<body>

<div id="player"></div>


<script>

setTimeout(()=>{

console.log("Clappr:", Clappr);
console.log("Plugin:", ClapprAudioTrackSelector);


const player = new Clappr.Player({

    source:
    "https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8",

    parentId:"#player",

    width:"100%",
    height:"100%",

    autoPlay:false,

    plugins:[
        ClapprAudioTrackSelector
    ]

});


},1000);

</script>

</body>
</html>
