<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Shaka Player</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.10.5/controls.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.10.5/shaka-player.ui.js"></script>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
}

.video-container{
    width:100%;
    height:100vh;
}

video{
    width:100%;
    height:100%;
}
</style>

</head>

<body>

<div class="video-container" data-shaka-player-container>

<video
id="video"
data-shaka-player
autoplay
controls>
</video>

</div>


<script>

async function init(){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){
    alert("Navegador no compatible");
    return;
}


const video = document.getElementById("video");

const player = new shaka.Player(video);


const ui = new shaka.ui.Overlay(
    player,
    document.querySelector(".video-container"),
    video
);


player.addEventListener("error", e=>{
    console.error("Error:", e.detail);
});


await player.load(
"https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/master.m3u8"
);


console.log("Cargado");

console.log(
"Audios:",
player.getVariantTracks()
);

console.log(
"Subtitulos:",
player.getTextTracks()
);


}


document.addEventListener(
"DOMContentLoaded",
init
);

</script>


</body>
</html>
