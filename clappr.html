<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clappr Player - 1080p Stream</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #000;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #player {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <script>
    const player = new Clappr.Player({
      source: "https://nbculocallive.akamaized.net/hls/live/2037499/puertorico/stream1/master_1080.m3u8",
      parentId: "#player",
      width: '100%',
      height: '100%',
      autoPlay: true,
      mute: false,
      shakaOnRebuffer: true
    });
  </script>

</body>
</html>
