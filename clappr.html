<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr Player</title>

    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <style>
        html, body {
            margin: 0;
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #player {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="player"></div>

<script>
new Clappr.Player({
    source: "https://knife-cloudy-tuner-buildings.trycloudflare.com/Michael/stream.m3u8",
    parentId: "#player",
    autoPlay: true,
    mute: false,
    width: "100%",
    height: "100%",
    mediacontrol: {
        seekbar: "#ff0000",
        buttons: "#ffffff"
    }
});
</script>

</body>
</html>
